[project]
name = "cobrastyle-lightningcss"
version = "0.0.0.dev1"
description = "Python bindings for lightningcss"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/nickolaj-jepsen/cobrastyle"

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
