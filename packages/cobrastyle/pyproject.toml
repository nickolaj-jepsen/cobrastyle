[project]
name = "cobrastyle"
version = "0.0.0.dev1"
description = "CSS modules for Python template engines"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "cobrastyle-lightningcss",
]

[project.optional-dependencies]
jinja2 = [
    "jinja2>=3.1",
]
flask = [
    "flask>=3.0",
]
fastapi = [
    "fastapi>=0.110",
]
cli = [
    "click>=8.1",
]
django = [
    "django>=5.2",
    "jinja2>=3.1",
]

[project.scripts]
cobrastyle = "cobrastyle.cli:cli"

[project.urls]
Repository = "https://github.com/nickolaj-jepsen/cobrastyle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
