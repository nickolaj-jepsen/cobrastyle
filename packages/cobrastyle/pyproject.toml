[project]
name = "cobrastyle"
version = "0.0.0.dev1"
description = "CSS modules for Python template engines"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [{ name = "Nickolaj Jepsen", email = "nickolaj@fireproof.website" }]
keywords = ["css", "css-modules", "jinja2", "lightningcss", "templates", "flask", "django", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Exact pin: CSS-module class hashes are only stable within a single
# cobrastyle-lightningcss release. Versions are kept in lockstep by `just bump`.
dependencies = [
    "cobrastyle-lightningcss==0.0.0.dev1",
]

[project.optional-dependencies]
jinja2 = [
    "jinja2>=3.1",
]
flask = [
    "flask>=3.0",
]
fastapi = [
    "fastapi>=0.110",
    "jinja2>=3.1",
]
cli = [
    "click>=8.1",
    "jinja2>=3.1",
]
django = [
    "django>=5.2",
    "jinja2>=3.1",
]

[project.scripts]
cobrastyle = "cobrastyle.cli:cli"

[project.urls]
Repository = "https://github.com/nickolaj-jepsen/cobrastyle"
Issues = "https://github.com/nickolaj-jepsen/cobrastyle/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
