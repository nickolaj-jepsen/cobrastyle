name: Release

on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/versions.py check
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -Po '(?<=^version = ")[^"]+' packages/cobrastyle/pyproject.toml)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package version $version" >&2
            exit 1
          fi

  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-latest
            target: aarch64
            manylinux: auto
          # macos-latest runners are arm64; maturin cross-compiles the Intel wheel
          - os: macos-latest
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/cobrastyle-lightningcss
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: packages/cobrastyle-lightningcss/dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package cobrastyle-lightningcss --sdist --out-dir dist
      - run: uv build --package cobrastyle --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
