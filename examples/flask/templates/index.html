{% extends "base.html" %}
{% block title %}Home · cobrastyle demo{% endblock %}
{% block content %}
  {% cobrastyle styles = "index.css" %}
  <section class="{{ styles.hero }}">
    <h1 class="{{ styles.title }}">CSS modules for Python</h1>
    <p>Class names are scoped per stylesheet, so this page can't collide with any other.</p>
    <a class="{{ cx(styles.cta, {styles.featured: featured}) }}" href="/about">How it works</a>
  </section>
{% endblock %}
