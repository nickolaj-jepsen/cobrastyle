{% cobrastyle "reset.global.css" %}
{% cobrastyle layout = "base.css" %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}cobrastyle demo{% endblock %}</title>
    {{ cobrastyle.links() }}
    <script src="https://unpkg.com/htmx.org@2.0.7" defer></script>
  </head>
  <body class="{{ layout.page }}">
    <h1 class="visually-hidden">cobrastyle demo</h1>
    <nav class="{{ layout.nav }}">
      <a href="/">Home</a>
      <a href="/about">About</a>
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
