[tool.uv.workspace]
members = ["packages/*", "examples/flask", "examples/fastapi", "examples/django"]

[tool.uv.sources]
cobrastyle-lightningcss = { workspace = true }
cobrastyle = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "pyrefly>=1.1",
    "jinja2>=3.1",
    "flask>=3.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "click>=8.1",
    "django>=5.2",
    "django-stubs>=6.0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages", "examples"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "PT",  # flake8-pytest-style
    "C4",  # flake8-comprehensions
    "PGH", # pygrep-hooks (no blanket noqa / type: ignore)
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["cobrastyle", "cobrastyle_lightningcss"]

[tool.pyrefly]
project-includes = ["packages", "examples"]
search-path = ["packages/cobrastyle/src", "examples/django"]
python-version = "3.12"
